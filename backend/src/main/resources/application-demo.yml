# Profile demo: dùng khi phát triển trên máy và cho bản docker compose đem đi
# bảo vệ. Chỉ có hai profile trong toàn dự án — demo và prod.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # KHÔNG khai `path`. Khai `path: /swagger-ui/index.html` (bản trước) làm
    # springdoc đăng ký một redirect ngay tại URL đó, che mất chính tệp
    # index.html của webjar, rồi chuyển hướng sang `/swagger-ui/swagger-ui/
    # index.html` — thừa một cấp. Bỏ thuộc tính này thì webjar được phục vụ
    # thẳng ở /swagger-ui/index.html, đúng URL mà SecurityConfig đã mở
    # (`/swagger-ui/**`) và đúng URL ghi trong tài liệu.

payments:
  simulator:
    # Hai endpoint mô phỏng chuyển khoản cùng đọc cờ này: bản quản trị
    # (/api/admin/dev/**, đòi vai trò ADMIN) và nút "tôi đã chuyển khoản" của
    # khách (/api/bookings/*/simulate-transfer, đòi mã truy cập của đúng đơn).
    #
    # Mặc định TẮT kể cả ở demo. Chỗ bật là docker-compose.yml — ở đó biến
    # PAYMENTS_SIMULATOR_ENABLED mặc định true vì bản đem đi bảo vệ cần chạy
    # trọn vòng khi chưa có tài khoản SePay thật. Để mặc định trong mã nguồn
    # là TẮT thì một bản triển khai quên đổi cấu hình không tự dựng lên một
    # cửa xác nhận đơn miễn phí.
    enabled: false

logging:
  level:
    com.tvh.homestay: DEBUG
